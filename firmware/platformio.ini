[platformio]
default_envs = esp32-s3
; web/dist 是 Vite 构建产物，作为 LittleFS 根目录
data_dir = web/dist

; ESP32-S3-N16R8：16MB QIO Flash + 8MB OPI PSRAM
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; 构建 LittleFS 镜像前自动重建前端（web/dist 缺失或落后于源码时）
extra_scripts = pre:scripts/build_web.py
lib_deps =
    ; Web
    esp32async/ESPAsyncWebServer @ ^3.12.1
    esp32async/AsyncTCP @ ^3.5.0
    ; OLED
    olikraus/U8g2 @ ^2.36.18
    ; JSON
    bblanchon/ArduinoJson @ ^7.4.3
    ; Servo
    madhephaestus/ESP32Servo @ ^3.0.0

; unit test
; 只编译不含 Arduino 调用的部分：core/、config/、motion/、
; platform/ 的 native 分支，以及 web/ 里的纯函数 http_util
; 和 perception/ 里不依赖摄像头的 gesture_recognizer
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
build_src_filter = +<core/> +<config/> +<motion/> +<platform/> +<web/http_util.cpp> +<perception/gesture_recognizer.cpp>
test_filter = test_*
